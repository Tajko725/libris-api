spring:
  application:
    name: libris-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/libris}
    username: ${DB_USER:libris}
    password: ${DB_PASSWORD:libris}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

libris:
  loans:
    # Zasady wypożyczeń: okres wypożyczenia (dni), limit niezwróconych książek na czytelnika, długość przedłużenia (dni)
    period-days: 30
    max-active-per-reader: 5
    renewal-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true