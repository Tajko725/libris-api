# Ciągła integracja: każdy push i pull request buduje projekt i uruchamia wszystkie testy.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Workflow potrzebuje tylko odczytu kodu.
permissions:
  contents: read

# Nowy przebieg dla tej samej gałęzi anuluje poprzedni, który jeszcze trwa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build i testy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pobieram kod
        uses: actions/checkout@v7

      - name: Instaluję Javę 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers korzysta z Dockera zainstalowanego na runnerze, więc nie wymaga konfiguracji.
      # chmod chroni przed utratą bitu wykonywania pliku mvnw (np. po zapisie na Windowsie).
      - name: Buduję i uruchamiam testy (verify)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Zapisuję raporty testów
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Obraz Dockera
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Pobieram kod
        uses: actions/checkout@v7

      # Sprawdzam tylko, czy obraz się buduje. Publikację do ghcr.io dodam przy wydaniu 1.0.0.
      - name: Buduję obraz
        run: docker build --tag libris-api:ci .
